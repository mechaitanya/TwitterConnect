# Cross-platform validation for XConnect. NOTHING HERE HAS BEEN EXECUTED YET: it was written on macOS and could not be run on GitHub Actions
# (see docs/release-readiness.md). It never publishes: there is no NuGet push step, and no secrets are used.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore XConnect.sln

      - name: Build (Debug)
        run: dotnet build XConnect.sln -c Debug --no-restore

      - name: Build (Release, warnings are errors)
        run: dotnet build XConnect.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/XConnect.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Integration tests stay gated (no credentials, no network)
        run: |
          for v in $(env | grep -E '^XCONNECT_' | cut -d= -f1); do echo "::error::$v is set on CI; live tests must never run here"; exit 1; done
          dotnet test tests/XConnect.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Samples compile
        run: |
          dotnet build samples/Usage -c Release --no-restore
          dotnet build samples/AotCheck -c Release --no-restore

      - name: Native AOT publish and run
        run: |
          dotnet publish samples/AotCheck -c Release -o aot-out
          ./aot-out/AotCheck

      - name: Trimmed (non-AOT) publish and run
        run: |
          dotnet publish samples/AotCheck -c Release --use-current-runtime --self-contained -p:PublishAot=false -p:PublishTrimmed=true -o trim-out
          ./trim-out/AotCheck

      - name: Pack
        run: dotnet pack src/XConnect -c Release --no-build -o artifacts

      - name: Verify the package
        run: |
          python3 tools/verify_package.py artifacts --allow-dirty-commit
          python3 tools/test_verify_package.py artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: artifacts/
          retention-days: 7

  spec-drift:
    # Informational: the generator downloads the live OpenAPI document, so a failure means X changed its API, not that this commit is broken.
    name: spec drift (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/generate_coverage.py
      - run: git diff --exit-code -- docs/api-coverage.md docs/spec-snapshot.json
